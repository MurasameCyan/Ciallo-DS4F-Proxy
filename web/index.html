<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciallo DS4F Proxy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 跳过导航,读屏/键盘用户直达主内容 -->
<a class="skip" href="#main">跳到主内容</a>

<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">✧</span>
    <span class="name">Ciallo<em>DS4F</em></span>
  </div>

  <div class="top-actions">
    <!-- 构建标识。hash 链到那次 commit;⟳ 只在点的时候才去问 GitHub
         (匿名 API 每小时 60 次,自动查会烧光);最后一个直接开仓库。
         三个当一组不拆开,窄屏时整组一起折行。
         状态灯和操作按钮都搬进「配置」卡了,页头只留身份和版本。 -->
    <span class="build">
      <a class="bid" id="build-id" href="https://github.com/MurasameCyan/Ciallo-DS4F-Proxy"
         target="_blank" rel="noopener noreferrer">—</a>
      <button type="button" class="btn tiny icon" id="btn-update" title="检查更新" aria-label="检查更新">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
      <a class="btn tiny icon" id="repo-link" href="https://github.com/MurasameCyan/Ciallo-DS4F-Proxy"
         target="_blank" rel="noopener noreferrer" title="在 GitHub 上打开仓库" aria-label="在 GitHub 上打开仓库">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.05-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.13 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
    </span>

    <!-- 退出登录。会话是 HttpOnly cookie,前端删不掉,只能让服务端作废 -->
    <button type="button" class="btn tiny icon" id="btn-logout" title="退出登录" aria-label="退出登录">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>
</header>

<main id="main">

  <!-- ── 概览 ───────────────────────────────────────────── -->
  <section class="grid stats" aria-label="用量概览">
    <article class="card stat">
      <h3>请求总数</h3>
      <p class="big" id="s-req">—</p>
      <p class="sub" id="s-req-sub">成功 — · 失败 —</p>
    </article>
    <article class="card stat">
      <h3>成功率</h3>
      <p class="big" id="s-rate">—</p>
      <div class="bar" role="img" aria-labelledby="s-rate"><span id="s-rate-bar"></span></div>
    </article>
    <article class="card stat">
      <h3>Token 消耗</h3>
      <p class="big" id="s-tok">—</p>
      <p class="sub" id="s-tok-sub">输入 — · 输出 — · 推理 —</p>
    </article>
    <article class="card stat">
      <h3>运行时长</h3>
      <p class="big" id="s-up">—</p>
      <p class="sub" id="s-up-sub">最后请求 —</p>
    </article>
  </section>

  <!-- 以下四张卡直接做 main 的 grid item(见 style.css 的三列布局)。
       DOM 顺序 == 视觉顺序,所以不用 grid 显式定位,Tab 顺序也就是对的。 -->

  <!-- ── 接入信息 ─────────────────────────────────────── -->
  <section class="card" aria-labelledby="h-conn">
    <div class="card-head"><h2 id="h-conn">接入</h2></div>

    <label class="field">
      <span class="lbl">Base URL</span>
      <span class="copyrow">
        <input type="text" id="f-base" readonly>
        <button type="button" class="btn tiny" data-copy="f-base">复制</button>
      </span>
    </label>

    <label class="field">
      <span class="lbl">API Key</span>
      <!-- 不给「显示」:面板本身就在明文返回它,但屏幕上留着一串完整 key
           没什么用 —— 要用就「复制」(复制的是真值,不是这里的掩码)。 -->
      <span class="copyrow">
        <input type="text" id="f-key" readonly>
        <button type="button" class="btn tiny" id="btn-regen">重置</button>
        <button type="button" class="btn tiny" data-copy="f-key" data-copy-real="key">复制</button>
      </span>
    </label>

    <div class="field">
      <span class="lbl">可用模型 <small>上游现拉</small></span>
      <ul class="models" id="models"></ul>
    </div>
  </section>

  <!-- ── 配置 ───────────────────────────────────────────── -->
  <section class="card" aria-labelledby="h-cfg">
    <div class="card-head"><h2 id="h-cfg">配置</h2></div>

    <!-- 状态灯从页头搬到这儿:它和下面这几个按钮是一回事 —— 看一眼状态、
         然后动手。分在两个地方要来回扫视。 -->
    <div class="pills" role="status" aria-live="polite" aria-label="运行状态">
      <span class="pill" id="pill-gw"><i class="dot" aria-hidden="true"></i><span data-t>网关</span></span>
      <span class="pill" id="pill-mh"><i class="dot" aria-hidden="true"></i><span data-t>内核</span></span>
      <span class="pill" id="pill-node"><i class="dot" aria-hidden="true"></i><span data-t>节点</span></span>
    </div>

    <form id="cfg-form" novalidate>
      <label class="field">
        <span class="lbl">订阅地址 <small>Clash / YAML</small></span>
        <input type="url" id="f-sub" placeholder="https://…/subscribe?token=…" autocomplete="off" spellcheck="false">
      </label>
      <p class="err" id="cfg-err" role="alert" hidden></p>
      <button type="submit" class="btn primary wide" id="btn-save">保存并应用</button>
    </form>

    <div class="row-actions">
      <button type="button" class="btn ghost" id="btn-restart">重启内核</button>
      <button type="button" class="btn ghost" id="btn-zero">清零统计</button>
      <button type="button" class="btn warn" id="btn-reset">手动重置</button>
    </div>
  </section>

  <!-- ── 日志 ───────────────────────────────────────────── -->
  <section class="card fill span2" aria-labelledby="h-log">
    <div class="card-head">
      <h2 id="h-log">运行日志</h2>
      <div class="log-tools">
        <div class="segs" role="group" aria-label="按级别过滤">
          <button type="button" class="seg on" data-lv="all">全部</button>
          <button type="button" class="seg" data-lv="ok">成功</button>
          <button type="button" class="seg" data-lv="warn">警告</button>
          <button type="button" class="seg" data-lv="error">错误</button>
        </div>
        <label class="chk"><input type="checkbox" id="f-follow" checked><span>自动滚动</span></label>
        <button type="button" class="btn tiny" id="btn-logclear">清屏</button>
      </div>
    </div>
    <ol class="log" id="log" tabindex="0" aria-label="日志输出"></ol>
  </section>

  <!-- ── 节点池 ─────────────────────────────────────────── -->
  <section class="card fill" aria-labelledby="h-nodes">
    <div class="card-head">
      <h2 id="h-nodes">节点池</h2>
      <!-- 这列只有 340px,长句会折行把卡头顶高、和日志卡的头对不齐。
           所以「按延迟排序」这类说明放进 ul 的 aria-label,不占一行。 -->
      <div class="node-tools">
        <span class="hint" id="nodes-tested">还没测过</span>
        <button type="button" class="btn tiny" id="btn-speed">测延迟</button>
      </div>
    </div>
    <ul class="nodes" id="nodes" aria-live="polite"
        aria-label="节点池,按实测延迟排序,从上往下就是网关接下来会用的顺序"></ul>
    <!-- 不写「上面/右边」:三列和单列下配置卡的相对位置不一样 -->
    <p class="empty" id="nodes-empty" hidden>还没有节点 —— 先在「配置」里填订阅地址。</p>
  </section>
</main>

<!-- 操作反馈。aria-live 让读屏也能听到 -->
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="app.js"></script>
</body>
</html>
