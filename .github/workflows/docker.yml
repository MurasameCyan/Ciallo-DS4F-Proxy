name: 构建并推送镜像

# push 到 main 出 latest;打 v* 标签出版本号;PR 只构建不推(验证 Dockerfile 没写坏)。
on:
  push:
    branches: [main]
    tags: ['v*']
    # 只动文档不重建镜像,省 Actions 额度
    paths-ignore: ['**.md', '.gitignore', '.shots/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 零依赖,没有 npm install 这一步
      - run: npm test
      # 出站链路的回归测试。单独一步是因为它要 openssl 生成自签证书,
      # 而 npm test 得能在没有 openssl 的机器上跑。runner 自带 openssl。
      - name: 验 TLS-over-CONNECT 出站
        run: node scripts/verify-tunnel.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # 推 GHCR 靠这个,不用另配 secret
    steps:
      - uses: actions/checkout@v4

      # GHCR 的镜像名必须全小写,而 owner(MurasameCyan)带大写字母,
      # 直接拿 github.repository 拼会推不上去。
      - name: 镜像名转小写
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # arm64 是靠 QEMU 模拟构建的。本项目不编译原生代码,
      # 唯一的跨架构动作是下对应的 mihomo 二进制,所以慢不到哪去。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 算标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 拉起容器验一遍
        # 只在 amd64 上验:runner 就是 amd64,QEMU 跑 arm64 起容器又慢又容易假失败。
        # 不给订阅地址,验的是"没订阅也能起来、面板要鉴权、/health 通" ——
        # 真订阅需要凭据,CI 里没有。
        if: github.event_name != 'pull_request'
        run: |
          set -eux
          docker build --load -t verify:local .
          docker run -d --name verify -e PANEL_PASS=ci-test -p 9527:9527 verify:local
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9527/health | grep -q '"ok":true'; then break; fi
            [ "$i" = 30 ] && { docker logs verify; exit 1; }
            sleep 1
          done
          # 面板必须挡住匿名访问
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9527/api/config)
          [ "$code" = 401 ] || { echo "面板没鉴权! 返回 $code"; docker logs verify; exit 1; }
          key=$(curl -fsS -u admin:ci-test http://127.0.0.1:9527/api/status | grep -o deepseek | head -1)
          [ -n "$key" ] || { echo "/api/status 不对"; docker logs verify; exit 1; }

          # 两种鉴权头都得认。只认 Bearer 的话 /v1/messages 对每个 Anthropic
          # 客户端都是 401,而客户端会把 401 显示成「模型不存在」—— 实测踩过,
          # 排查方向被带偏很久,所以钉死在 CI 里。
          K=$(docker exec verify node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            process.stdout.write(JSON.parse(readFileSync('/data/config.json','utf8')).apiKey);
          ")
          [ -n "$K" ] || { echo "取不到 apiKey"; docker logs verify; exit 1; }
          for h in "authorization: Bearer $K" "x-api-key: $K"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "$h" http://127.0.0.1:9527/v1/models)
            [ "$code" = 200 ] || { echo "鉴权头 '${h%%:*}' 被拒(返回 $code)"; docker logs verify; exit 1; }
          done
          # 错的 key 必须挡住
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: nope" http://127.0.0.1:9527/v1/models)
          [ "$code" = 401 ] || { echo "错 key 竟然返回 $code"; exit 1; }

          # /v1/messages 的错误体必须是 Anthropic 形状(SDK 读的是 error.type)。
          # 没订阅所以拿不到节点,这里验的就是 503 那条路的形状。
          body=$(curl -s -H "x-api-key: $K" -H 'content-type: application/json' \
            -d '{"model":"x","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}' \
            http://127.0.0.1:9527/v1/messages)
          echo "$body" | grep -q '"type":"error"' || { echo "messages 错误体不是 Anthropic 形状: $body"; exit 1; }

          # count_tokens:缺这个路由 Claude Code 开工前就退出了
          curl -fsS -H "x-api-key: $K" -H 'content-type: application/json' \
            -d '{"model":"x","messages":[{"role":"user","content":"hello"}]}' \
            http://127.0.0.1:9527/v1/messages/count_tokens | grep -q input_tokens \
            || { echo "count_tokens 不可用"; exit 1; }

          # 生成的 mihomo 配置,让镜像里那个真内核过一遍。
          # 光看退出码不够:mihomo 遇到已废弃的配置项会照常退 0,只往 stderr
          # 吐一行 error(v1.19 移除 global-client-fingerprint 就是这样),
          # 而那行会一路显示到面板日志里。所以 error 出现即失败。
          # 假订阅地址(127.0.0.1:1 必然连不上)。实测这种情况下 mihomo -t 照样
          # 退 0 并报 successful —— 它只校验配置本身,不要求 provider 拉得到,
          # 所以这道检查不需要真凭据。
          docker exec verify node --input-type=module -e "
            import { writeFileSync } from 'node:fs';
            import { buildMihomoYaml } from 'file:///app/server/config.mjs';
            writeFileSync('/tmp/t.yaml', buildMihomoYaml('http://127.0.0.1:1/sub'));
          "
          docker exec verify mihomo -t -d /tmp -f /tmp/t.yaml 2>&1 | tee /tmp/kt.log
          grep -q 'test is successful' /tmp/kt.log || { echo "内核不认这份配置"; exit 1; }
          if grep -q 'level=error' /tmp/kt.log; then
            echo "内核对配置报了 error(多半是用了已废弃的配置项):"
            grep 'level=error' /tmp/kt.log
            exit 1
          fi
          # MMDB 下载不该出现在启动路径上(DNS fallback 会把它拖进来)
          if grep -qi "can't find mmdb" /tmp/kt.log; then
            echo "配置触发了 MMDB 下载 —— 容器首启会多一个必须联外网的步骤"
            exit 1
          fi

          docker logs verify
          docker rm -f verify

      # GHCR 首次推送的包一律是私有的,而且**不跟随仓库可见性** ——
      # 仓库公开了包照样是私有,用户 docker compose pull 会收到
      # "unauthorized",看起来像构建失败,其实镜像好好的。
      # 改可见性没有 REST API(PATCH user/packages/... 返回 404),
      # 只能在网页上点一次,所以这里只能检测 + 把修复步骤打出来。
      # 检测手段:GHCR 的 token 端点对公开包会发匿名 token,私有包返回
      # UNAUTHORIZED。不用 docker pull 是因为 runner 已经 login 过,
      # 它拉得到不代表匿名用户拉得到。
      - name: 验镜像能匿名拉取
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          repo="${IMAGE#ghcr.io/}"
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n%s\n```\n' "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"

          resp=$(curl -sS "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io")
          if printf '%s' "$resp" | grep -q '"token"'; then
            echo "匿名可拉取 —— compose 里直接引用即可,不需要 build,也不用 docker login。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo
            echo "> [!WARNING]"
            echo "> **这个包还是私有的,用户 \`docker compose pull\` 会收到 \`unauthorized\`。**"
            echo "> 镜像本身没问题(上面几步都过了),只是 GHCR 新建的包默认私有,并且不跟随仓库可见性。"
            echo ">"
            echo "> 手动改一次,以后每次推送都继承这个设置:"
            echo "> 1. 打开 https://github.com/users/${{ github.repository_owner }}/packages/container/${repo##*/}/settings"
            echo "> 2. Danger Zone → Change visibility → Public"
            echo ">"
            echo "> 顺便在同一页 Manage Actions access 里确认本仓库有 Write 权限(自动加的,一般不用动)。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::包仍为私有,匿名拉取会失败。修复方式见本次运行的 Summary。"
