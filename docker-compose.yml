# Ciallo DS4F Proxy
#
# 拉起来:把这个文件和 .env 放同一个目录,然后
#   docker compose up -d
# 镜像由 GitHub Actions 构建好推到 GHCR,不用自己 build。
#
#   docker compose pull && docker compose up -d     # 升级
#
# pull 报 unauthorized:不是构建失败,是 GHCR 的包默认私有(且不跟随仓库可见性)。
# 仓库 owner 在 packages 设置页把 visibility 改成 Public 即可,只需一次。
# 详见 README 的「镜像 → 包默认是私有的」。
#
# 面板: http://127.0.0.1:9527       (Basic 认证,用 PANEL_USER / PANEL_PASS)
# 接口: http://127.0.0.1:9527/v1    (OpenAI 兼容,Bearer 用面板里那个 Key)

services:
  proxy:
    image: ghcr.io/murasamecyan/ciallo-ds4f-proxy:latest
    container_name: ciallo-ds4f-proxy
    restart: unless-stopped

    # 只绑在本机回环。面板会明文显示 API Key 和订阅地址(里面有机场 token),
    # 想让同网段其它机器的 agent 也能连,改成 "9527:9527" —— 那等于把面板
    # 一起暴露到局域网,此时 PANEL_PASS 必须设一个强密码。
    ports:
      - "127.0.0.1:9527:9527"

    # 想让同一台机器上别的 compose 项目(比如各种 agent 容器)直接按容器名连过来,
    # 就把下面两段和文件末尾的 networks 一起解注释。加入同一个外部网络之后,
    # 那些容器用 http://ciallo-ds4f-proxy:9527/v1 就能访问,不必绕
    # host.docker.internal 或者宿主的回环端口 —— 回环映射在容器里连不上,而
    # host.docker.internal 在 Linux 上默认不存在。上面的 ports 可以一起删掉,
    # 只走内部网络的话面板和 API 都不再暴露到宿主。
    # 网络得先自己建好(compose 不会替你建 external 的):
    #   docker network create ai-internal
    # networks:
    #   - ai-internal

    environment:
      # 面板凭据。不设 PANEL_PASS 的话每次启动随机生成一个,
      # 密码只出现在 docker logs 里,容器一重启就变。
      PANEL_USER: ${PANEL_USER:-admin}
      PANEL_PASS: ${PANEL_PASS:?先在 .env 里设 PANEL_PASS,面板会明文显示订阅凭据}
      # 订阅地址。只在首次启动播种;之后以卷里的 config.json 为准,
      # 在面板里改完不会被这里的旧值覆盖回去。
      SUBSCRIPTION_URL: ${SUBSCRIPTION_URL:-}
      # 对外 API Key,留空则首次启动自动生成,面板里能看能换。
      API_KEY: ${API_KEY:-}

    # 订阅凭据、Key、用量、内核缓存都在这儿。用命名卷而不是 ./data 绑挂:
    # 容器里以 node(uid 1000)运行,宿主目录属主对不上就会 permission denied。
    # 真要绑挂,先 mkdir data && sudo chown 1000:1000 data。
    volumes:
      - ciallo-data:/data

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  ciallo-data:

# 配合上面 services.proxy.networks 一起解注释。external: true 是「这个网络我在
# 外面建好了,别管它的生命周期」—— compose down 不会把它删掉,别的项目还连着。
# networks:
#   ai-internal:
#     external: true
